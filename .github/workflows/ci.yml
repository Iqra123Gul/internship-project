name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black pytest
          pip install -r docker-requirements.txt

      - name: Lint with flake8
        run: flake8 src/ app/ tests/ --max-line-length=120 --extend-ignore=E203,W503

      - name: Check formatting with black
        run: black --check src/ app/ tests/

      - name: Run pytest
        run: pytest tests/ -v

  docker-build:
    needs: lint-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build base image
        run: docker build -f docker/base.Dockerfile -t flickr8k-base .

      - name: Build API image
        run: docker build -f docker/app.Dockerfile -t flickr8k-api .

      - name: Confirm image built
        run: docker images